<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <span class="login-icon">🎉</span>
      <h2>EventMaster</h2>
      <p>Ingrese sus credenciales para acceder</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="usuario@ejemplo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="......"
          required
        />
      </div>

      <!-- Mensaje de validación de error -->
      <div *ngIf="errorMessage" class="error-alert">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <!-- Credenciales de prueba -->
    <div style="margin-top: 20px; text-align: center; font-size: 12px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 15px;">
      <p style="margin-bottom: 5px;"><strong>Credenciales de Prueba:</strong></p>
      <p style="margin: 2px 0;">👑 Admin: admin&#64;eventos.com / admin123</p>
      <p style="margin: 2px 0;">👤 Usuario: usuario&#64;eventos.com / user123</p>
    </div>
  </div>
</div>
